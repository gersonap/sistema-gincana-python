<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Gincanas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🏆 Gincana Manager</span>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Ranking das Equipes</h2>
        
        <div class="row">
            
            {% for equipe in equipes %}
            
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">{{ equipe.nome }}</h5>
                    </div>
                    <div class="card-body">
                        <p class="card-text"><strong>Líder:</strong> {{ equipe.lider }}</p>
                        <p class="card-text"><strong>Membros:</strong> {{ equipe.qtde_membros }}</p>
                        <h3 class="text-center text-primary">{{ equipe.pontuacao }} pts</h3>
                    </div>
                </div>
            </div>
            
            {% endfor %}
            
        </div>
    </div>

</body>
</html>
